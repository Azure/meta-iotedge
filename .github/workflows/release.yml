name: Release

on:
  push:
    tags:
      - "1.5.*"
      - "1.6.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g., 1.5.40 or 1.6.0-rc.1)"
        required: true

permissions:
  contents: read
  packages: read

# Serialize publication across release lines too: an older run must not race
# a newer stable release for Latest. Never cancel halfway through asset uploads.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release tag before building
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check out workflow tooling and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Resolve existing supported release tag
        id: tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const {preflight} = require('./scripts/publish-release.cjs');
            const info = preflight(process.env.RELEASE_TAG);
            core.setOutput('tag', info.tag);
            core.setOutput('commit', info.commit);

  build:
    name: Build and validate
    needs: preflight
    uses: ./.github/workflows/ci-build.yml
    with:
      # Build the resolved immutable commit, not a ref that can move mid-run.
      ref: ${{ needs.preflight.outputs.commit }}
      release_tag: ${{ needs.preflight.outputs.tag }}
      skip_qemu: false
    secrets: inherit

  release:
    name: Create release
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      # Publication tooling comes from this workflow's commit. Preflight rejects
      # historical source tags without the helpers/tests required by reusable CI;
      # there is no tooling overlay or support for rebuilding those older tags.
      - name: Check out workflow tooling and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0

      - name: Verify release metadata against built commit
        id: metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {preflight, releasePolicy} = require('./scripts/publish-release.cjs');
            const info = preflight(process.env.VERSION);
            if (info.commit !== process.env.EXPECTED_COMMIT) throw new Error('Release tag moved after preflight');
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const policy = releasePolicy(info.tag, releases);
            for (const [key, value] of Object.entries({...info, ...policy})) {
              if (key !== 'order') core.setOutput(key, value);
            }

      - name: Download RPM packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rpm-packages-${{ needs.build.outputs.template }}
          path: release-artifacts/rpm

      - name: Download QEMU image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iotedge-qemu-image-${{ needs.build.outputs.template }}
          path: release-artifacts/qemu

      - name: Prepare complete release artifacts
        run: |
          set -euo pipefail
          python3 scripts/collect-release-artifacts.py \
            --rpm-dir release-artifacts/rpm --qemu-dir release-artifacts/qemu \
            --output-dir final-artifacts --version "$VERSION"

      - name: Prepare release notes
        env:
          SERIES: ${{ steps.metadata.outputs.series }}
          YOCTO: ${{ steps.metadata.outputs.yocto }}
          TEMPLATE: ${{ steps.metadata.outputs.template }}
          HAS_STABLE_16: ${{ steps.metadata.outputs.has_stable_16 }}
        run: |
          set -euo pipefail
          case "$TEMPLATE" in
            scarthgap)
              RELEASE_SUMMARY="This is a maintenance release for the **Scarthgap (Yocto 5.0) / IoT Edge 1.5.x** line. It is not a downgrade from a 1.6.x release."
              ;;
            scarthgap-1.6)
              RELEASE_SUMMARY="This release delivers **IoT Edge 1.6.x on Yocto 5.0 (Scarthgap)**, for devices that need 1.6 before moving to Wrynose (Yocto 6.0). It uses the same 1.6.x daemon as the Wrynose line."
              ;;
            wrynose)
              RELEASE_SUMMARY="This release belongs to the **Wrynose (Yocto 6.0) / IoT Edge 1.6.x** line."
              ;;
            *) exit 1 ;;
          esac
          if [[ "$HAS_STABLE_16" == "true" ]]; then
            WRYNOSE_STATUS="Active and maintained"
          else
            WRYNOSE_STATUS="Active; latest release is a prerelease"
          fi

          cat > release-notes.md <<EOF
          ## ${YOCTO} release for IoT Edge ${SERIES}.x

          ${RELEASE_SUMMARY}

          The repository maintains multiple release lines side by side:

          | Yocto release | IoT Edge line | Status |
          | --- | --- | --- |
          | Scarthgap (5.0) | 1.5.x | Active and supported through November 2026 |
          | Wrynose (6.0) | 1.6.x | ${WRYNOSE_STATUS} |
          | Scarthgap (5.0) | 1.6.x (\`-scarthgap\` tags) | IoT Edge 1.6 on Yocto 5.0, for devices not yet on Wrynose |

          Release tags select the line: \`1.5.x\` -> Scarthgap/1.5, \`1.6.x\` -> Wrynose/1.6, \`1.6.x-scarthgap\` -> Scarthgap/1.6. Choose the tag that matches your Yocto release.

          ## Build from source

          Most users should build from source using the recipes in this repository. The prebuilt RPMs below target \`qemux86-64\` and will not work on other hardware.

          \`\`\`bash
          git clone --branch ${VERSION} https://github.com/${GITHUB_REPOSITORY}.git
          cd meta-iotedge
          ./scripts/build.sh ${TEMPLATE}
          \`\`\`

          ## Prebuilt artifacts (qemux86-64 only)

          These artifacts are primarily for CI verification and testing.
          **Test-only image:** debug-tweaks enables a blank root password; do not deploy it to production.

          ### RPM packages

          \`\`\`bash
          tar -xzvf iotedge-rpms-${VERSION}.tar.gz
          \`\`\`

          Included: iotedge, aziot-edged, aziotd, aziotctl, aziot-keys, plus available reviewed dbg/dev/staticdev/doc subpackages.

          ### QEMU test image

          \`\`\`bash
          zstd -d iotedge-qemu-image-qemux86-64.rootfs.ext4.zst

          qemu-system-x86_64 \\
            -kernel bzImage \\
            -drive file=iotedge-qemu-image-qemux86-64.rootfs.ext4,format=raw \\
            -append "root=/dev/sda console=ttyS0" \\
            -nographic -m 1024
          \`\`\`

          ## Documentation

          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for build and integration instructions.

          > **Repository history note:** \`main\` contains both the Scarthgap/1.5.x and Wrynose/1.6.x recipes. Generated notes compare against the previous strictly older tag on this same Yocto/IoT Edge line, but the repository diff may still include changes for other release lines.
          EOF

      # Publisher deliberately blocks aggregate assets above 512 MiB before API
      # writes: Octokit buffers bodies. Larger releases need authenticated
      # streaming support; increasing the bound is not an unbounded-memory fix.
      - name: Upload, verify and publish GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const {preflight, publishRelease} = require('./scripts/publish-release.cjs');
            const info = preflight(process.env.VERSION);
            if (info.commit !== process.env.EXPECTED_COMMIT) throw new Error('Release tag moved after build');
            await publishRelease({github, ...context.repo, tag: info.tag,
              previousTag: info.previous_tag, commit: process.env.EXPECTED_COMMIT,
              artifactDir: 'final-artifacts', customNotes: fs.readFileSync('release-notes.md', 'utf8')});
