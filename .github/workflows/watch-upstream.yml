name: Watch upstream releases

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One combined branch, including both maintained LTS plans. Retain the legacy
# branch for migration; never race two matrix jobs overwriting that branch.
concurrency:
  group: watch-upstream-publication
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check both maintained LTS releases
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      plans: ${{ steps.check.outputs.plans }}
      base_sha: ${{ steps.check.outputs.base_sha }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect and validate plans
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { validatePlans } = require('./scripts/publish-upstream-pr.cjs');
            const plans = JSON.parse(execFileSync('bash', ['scripts/check-upstream.sh', '--plans-json'], { encoding: 'utf8' }));
            validatePlans(plans);
            core.setOutput('plans', JSON.stringify(plans));
            core.setOutput('base_sha', execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim());

  update-recipes:
    name: Generate, publish and clean up upstream PR
    needs: check-upstream
    # No needs_update gate: housekeeping must also run after a merge/no update.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write # provision missing metadata labels; preserve unrelated labels
      packages: read
    container:
      image: ghcr.io/azure/meta-iotedge-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - name: Checkout detected default-branch snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-upstream.outputs.base_sha }}
          fetch-depth: 0
      - name: Fix git permissions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Generate sequentially and publish using git and first-party API
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLANS_JSON: ${{ needs.check-upstream.outputs.plans }}
          DETECTED_BASE_SHA: ${{ needs.check-upstream.outputs.base_sha }}
        with:
          script: |
            const { publish } = require('./scripts/publish-upstream-pr.cjs');
            await publish({ github, context, plans: JSON.parse(process.env.PLANS_JSON), expectedBase: process.env.DETECTED_BASE_SHA });
      # Separate repository/org setting can still block API-created PRs:
      # "Allow GitHub Actions to create and approve pull requests" must be
      # enabled by an administrator. No new PAT/App is introduced here.
      # GITHUB_TOKEN-created PR CI may require writer approval; do not promise
      # unattended CI or bypass action policy by unpinning actions.

  notify-docker-only:
    name: Notify Docker-only releases on both lines
    needs: check-upstream
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout detection snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-upstream.outputs.base_sha }}
      - name: Notify with persistent exact-release acknowledgement
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLANS_JSON: ${{ needs.check-upstream.outputs.plans }}
        with:
          script: |
            const { notify } = require('./scripts/notify-upstream.cjs');
            await notify({ github, context, plans: JSON.parse(process.env.PLANS_JSON) });
