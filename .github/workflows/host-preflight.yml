name: Manual read-only host preflight

on:
  workflow_dispatch:
  # Isolated bootstrap route: this workflow is not registered on main yet.
  push:
    branches:
      - diag/host-cache-memory-preflight
    paths:
      - .github/workflows/host-preflight.yml
      - scripts/host-preflight.py

permissions:
  contents: read

concurrency:
  group: manual-host-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/diag/host-cache-memory-preflight'
    timeout-minutes: 2
    runs-on:
      - self-hosted
      - 1ES.Pool=meta-iotedge-1es-github-linux-amd64
      - 1ES.ImageOverride=agent-aziotedge-ubuntu-22.04-msmoby
    steps:
      - name: Checkout reviewed workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/host-preflight.py
          sparse-checkout-cone-mode: false
      - name: Collect current process visible evidence
        shell: bash
        run: python3 scripts/host-preflight.py > host-preflight.json
      - name: Upload only allowlisted JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-preflight
          path: host-preflight.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
