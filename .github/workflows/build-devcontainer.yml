name: Build devcontainer image

on:
  push:
    branches:
      - main
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-publication
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push devcontainer image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the runner's reviewed Docker CLI rather than third-party actions
      # whose SHA refs do not match the organization's tag-only allowlist.
      - name: Set up Docker Buildx
        env:
          BUILDER: meta-iotedge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          docker buildx create --name "$BUILDER" --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Login to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/meta-iotedge-devcontainer"
          # One neutral tag: host tools are Yocto-release-agnostic.
          # Keep :scarthgap as a transitional alias for existing consumers.
          docker buildx build .devcontainer --file .devcontainer/Dockerfile --push \
            --tag "$IMAGE:latest" --tag "$IMAGE:scarthgap" \
            --cache-from "type=registry,ref=$IMAGE:latest" --cache-to type=inline
          # Read both pushed manifests back before reporting publication success.
          docker buildx imagetools inspect "$IMAGE:latest"
          docker buildx imagetools inspect "$IMAGE:scarthgap"

      - name: Clean up registry login and builder
        if: always()
        env:
          BUILDER: meta-iotedge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker logout ghcr.io
          docker buildx rm "$BUILDER"
